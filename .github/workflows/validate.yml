name: Validate Worker

on:
  push:
    branches: ["main","saas-multitenant"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Check inline app script syntax
        run: node .github/scripts/check-inline-script.mjs && node --check /tmp/rentalos-inline.js
