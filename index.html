<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quad & Buggy Rental UAE</title><style>
:root{color-scheme:dark;--ink:#f4f0e7;--muted:#9da99d;--gold:#d6bb7b;--green:#a6c6a1;--panel:#141d19;--line:rgba(214,187,123,.17);--deep:#0b120f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 80% -15%,rgba(120,145,112,.16),transparent 42%),linear-gradient(145deg,#0a110f,#0d1512 54%,#101712);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;letter-spacing:.01em}
.app{display:flex;min-height:100vh}
.side{width:256px;background:rgba(12,19,16,.88);border-right:1px solid var(--line);padding:27px 19px 22px;flex:none;box-shadow:16px 0 44px rgba(0,0,0,.12)}
.brand{font-weight:750;font-size:18px;letter-spacing:.13em;margin:4px 10px 38px;color:#f6f1e5}.brand b{color:var(--gold);font-weight:650}.brand small{display:block;color:#87958a;font-size:9px;letter-spacing:.26em;margin-top:7px}
.nav{display:grid;gap:7px}.nav button,.btn{display:block;width:100%;border:1px solid transparent;background:transparent;color:#b4beb3;padding:11px 13px;border-radius:10px;margin:0;text-align:left;transition:all .18s ease;font:inherit;cursor:pointer}
.nav button:hover,.btn:hover{border-color:rgba(214,187,123,.2);background:rgba(255,255,255,.035);color:var(--ink)}
.nav button.active{background:linear-gradient(105deg,rgba(214,187,123,.17),rgba(214,187,123,.055));border-color:rgba(214,187,123,.22);color:#f2dfb2;box-shadow:inset 2px 0 0 var(--gold)}
.side .muted{position:sticky;top:calc(100vh - 56px);margin:45px 8px 0;font-size:11px;line-height:1.8;color:#76847a}
.main{flex:1;padding:42px clamp(22px,4.4vw,68px);max-width:1580px;margin:0 auto;width:100%}
.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:27px}
.top h1{font:500 34px/1.15 Georgia,"Times New Roman",serif;letter-spacing:-.025em;margin:0;color:#faf6ed}
.top p{margin:9px 0 0;font-size:13px;color:var(--muted)}
.btn{width:auto;border:1px solid rgba(214,187,123,.29);background:rgba(255,255,255,.025);border-radius:9px;padding:10px 15px}
.btn.primary{background:linear-gradient(135deg,#e5d09a,#c5a967);border-color:#d6bb7b;color:#151711;font-weight:700;box-shadow:0 8px 24px rgba(177,147,80,.16)}
.overviewHero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;min-height:176px;padding:29px 34px;margin:0 0 20px;border:1px solid rgba(214,187,123,.21);border-radius:17px;background:radial-gradient(circle at 82% 44%,rgba(182,158,101,.18),transparent 22%),linear-gradient(112deg,#19251f,#14201b 57%,#20281c);box-shadow:0 18px 48px rgba(0,0,0,.2)}
.overviewHero:after{content:"";position:absolute;width:220px;height:220px;right:70px;top:-125px;border:1px solid rgba(214,187,123,.12);border-radius:50%;box-shadow:0 0 0 22px rgba(214,187,123,.025),0 0 0 48px rgba(214,187,123,.018)}
.overviewHero h2{font:500 clamp(23px,2.5vw,31px)/1.2 Georgia,serif;margin:8px 0;color:#f5efdf;letter-spacing:-.02em}
.overviewHero p{color:#aeb8aa;margin:0;font-size:13px}
.eyebrow{font-size:9px;font-weight:700;letter-spacing:.22em;color:var(--gold)}
.heroMark{z-index:1;text-align:center;color:rgba(222,203,155,.72);font:italic 48px Georgia,serif;padding:6px 30px}.heroMark span{color:#f1e7ce}.heroMark small{display:block;font:700 8px system-ui;letter-spacing:.22em;color:#9eaa9a;margin-top:-4px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{position:relative;background:linear-gradient(145deg,rgba(25,35,29,.97),rgba(17,25,21,.96));border:1px solid rgba(195,209,184,.1);border-radius:13px;padding:19px 20px;min-height:105px;box-shadow:0 12px 30px rgba(0,0,0,.13);color:#b7c1b5;font-size:12px;letter-spacing:.025em}
.card:before{content:"";position:absolute;left:0;top:19px;bottom:19px;width:2px;border-radius:2px;background:linear-gradient(var(--gold),transparent);opacity:.72}
.metric{font:500 clamp(20px,2vw,25px)/1.1 Georgia,serif;margin-top:13px;color:#f3eee1;letter-spacing:-.02em}.accent{color:#d5c28c}
section{margin-top:29px}section h2{font:500 21px Georgia,serif;color:#f1ecdf;margin:0 0 13px;letter-spacing:-.01em}
.tablebox{overflow:auto;border:1px solid rgba(195,209,184,.1);border-radius:13px;background:rgba(18,26,21,.76);box-shadow:0 14px 34px rgba(0,0,0,.12)}
.tablebox table{width:100%;border-collapse:collapse;min-width:650px}.tablebox th,.tablebox td{padding:14px 16px;border-bottom:1px solid rgba(195,209,184,.075);text-align:left}.tablebox th{color:#a99562;font-size:9px;letter-spacing:.17em;text-transform:uppercase}.tablebox tbody tr:hover{background:rgba(255,255,255,.025)}
.modal{position:fixed;inset:0;background:rgba(2,6,4,.76);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modalbox{background:linear-gradient(145deg,#18221c,#101713);border:1px solid rgba(214,187,123,.24);border-radius:16px;padding:24px;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:0 28px 90px rgba(0,0,0,.5)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#abb5a8;letter-spacing:.02em}.field input{background:#0d1511;color:var(--ink);border:1px solid rgba(195,209,184,.17);border-radius:8px;padding:11px;font:inherit;outline:none}.field input:focus{border-color:rgba(214,187,123,.65);box-shadow:0 0 0 3px rgba(214,187,123,.08)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.empty{padding:34px;text-align:center;color:#869287}
.mobile{display:none}
@media(max-width:1000px){.side{width:224px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:30px 24px}}
@media(max-width:700px){.side{display:none}.mobile{display:flex;gap:6px;overflow:auto;margin-bottom:20px}.mobile button{min-width:max-content}.main{padding:20px 16px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:30px}.overviewHero{padding:24px 22px;min-height:155px}.heroMark{font-size:36px;padding:4px 8px}}
@media(max-width:500px){.grid,.form{grid-template-columns:1fr}.overviewHero:after{right:-100px}.heroMark{display:none}.card{min-height:96px}}
</style></head><body><div id="app"></div><script src="app.js?v=372390bd"></script></body></html>
